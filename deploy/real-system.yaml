# DigitalOcean App Platform - REAL Multi-Agent System
# Pet Ingredient Safety Checker with Web Research & AI

name: pet-safety-real-system
services:
- name: web
  source_dir: /
  run_command: gunicorn --bind 0.0.0.0:$PORT backend.app:app
  environment_slug: python
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 5000
  routes:
  - path: /
  health_check:
    http_path: /api/health
  envs:
  - key: OPENAI_API_KEY
    scope: RUN_TIME
    value: "sk-test-placeholder-add-real-key"
  - key: DATABASE_URL
    scope: RUN_TIME
    type: SECRET
  - key: FLASK_ENV
    scope: RUN_TIME
    value: production
  - key: SECRET_KEY
    scope: RUN_TIME
    value: "production-secret-key-change-me"

databases:
- name: pet-safety-db
  engine: PG
  version: "15"
  size: db-s-dev-database
