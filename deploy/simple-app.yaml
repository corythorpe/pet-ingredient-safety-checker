# DigitalOcean App Platform Configuration
# Pet Ingredient Safety Checker - Updated Version (No GitHub)

name: pet-safety-checker-final
static_sites:
- name: pet-safety-frontend
  source_dir: /
  index_document: templates/index.html
  routes:
  - path: /
- name: pet-safety-static
  source_dir: /static
  routes:
  - path: /static
services:
- name: backend
  source_dir: /
  run_command: python3 simple_server.py
  environment_slug: python
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 5000
  routes:
  - path: /api
  health_check:
    http_path: /api/health
  envs:
  - key: PORT
    scope: RUN_TIME
    value: "5000"
