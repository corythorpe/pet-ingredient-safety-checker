# DigitalOcean App Platform Configuration
# Pet Ingredient Safety Checker - Corrected Version with AI Agents

name: pet-safety-checker-ai
services:
- name: web
  source_dir: /
  run_command: gunicorn --bind 0.0.0.0:$PORT app:app
  environment_slug: python
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 8080
  routes:
  - path: /
  health_check:
    http_path: /api/health
  envs:
  - key: PORT
    scope: RUN_TIME
    value: "8080"
  - key: FLASK_ENV
    scope: RUN_TIME
    value: "production"
  - key: PYTHONPATH
    scope: RUN_TIME
    value: "/app"
  # DigitalOcean GenAI Configuration - Set these in the control panel
