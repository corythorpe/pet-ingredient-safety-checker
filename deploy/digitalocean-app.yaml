# DigitalOcean App Platform Configuration
# Pet Ingredient Safety Checker - Multi-Agent Application

name: pet-ingredient-safety-checker
services:
- name: web
  dockerfile_path: Dockerfile
  source_dir: /
  github:
    repo: corythorpe/pet-ingredient-safety-checker
    branch: main
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 5000
  routes:
  - path: /
  health_check:
    http_path: /api/health
  envs:
  - key: OPENAI_API_KEY
    scope: RUN_TIME
    value: "sk-test-key-placeholder"
  - key: DATABASE_URL
    scope: RUN_TIME
    type: SECRET
  - key: FLASK_ENV
    scope: RUN_TIME
    value: production
  - key: SECRET_KEY
    scope: RUN_TIME
    value: "dev-secret-key-change-in-production"

databases:
- name: pet-safety-db
  engine: PG
  version: "15"
  size: db-s-dev-database
