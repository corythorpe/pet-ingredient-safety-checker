# DigitalOcean App Platform Configuration
# Pet Ingredient Safety Checker - Multi-Agent Application

name: pet-ingredient-safety-checker
services:
- name: web
  dockerfile_path: Dockerfile
  source_dir: /
  github:
    repo: corythorpe/pet-ingredient-safety-checker
    branch: main
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 5000
  routes:
  - path: /
  health_check:
    http_path: /api/health
  envs:
  - key: FLASK_ENV
    scope: RUN_TIME
    value: production
  - key: PORT
    scope: RUN_TIME
    value: "8080"
  # DigitalOcean GenAI Agent Configuration - Required for Application
  - key: DIGITALOCEAN_TOKEN
    scope: RUN_TIME
    type: SECRET
  - key: DIGITALOCEAN_GENAI_RESEARCH_AGENT_ID
    scope: RUN_TIME
    value: "c9fca867-f7f1-11f0-b074-4e013e2ddde4"
  - key: DIGITALOCEAN_GENAI_RISK_AGENT_ID
    scope: RUN_TIME
    value: "d824a8b9-f7f1-11f0-b074-4e013e2ddde4"
  - key: DIGITALOCEAN_GENAI_FACTCHECK_AGENT_ID
    scope: RUN_TIME
    value: "e45b628c-f7f1-11f0-b074-4e013e2ddde4"
  - key: DIGITALOCEAN_GENAI_PROJECT_ID
    scope: RUN_TIME
    value: "eaef27d1-07e4-4973-9f14-8cd36724af54"
  - key: DIGITALOCEAN_GENAI_REGION
    scope: RUN_TIME
    value: "tor1"
  - key: DIGITALOCEAN_GENAI_INFERENCE_URL
    scope: RUN_TIME
    value: "https://inference.do-ai.run/v1"
