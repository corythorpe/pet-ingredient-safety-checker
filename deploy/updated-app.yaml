# DigitalOcean App Platform Configuration
# Pet Ingredient Safety Checker - Multi-Agent Application
# Updated with new agent UUIDs

name: pet-ingredient-safety-checker
services:
- name: web
  dockerfile_path: Dockerfile
  source_dir: /
  github:
    repo: corythorpe/pet-ingredient-safety-checker
    branch: main
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 5000
  routes:
  - path: /
  health_check:
    http_path: /api/health
  envs:
  - key: FLASK_ENV
    scope: RUN_TIME
    value: production
  - key: PORT
    scope: RUN_TIME
    value: "8080"
  # DigitalOcean API Token
  - key: DIGITALOCEAN_TOKEN
    scope: RUN_TIME
    type: SECRET
  - key: DIGITALOCEAN_API_TOKEN
    scope: RUN_TIME
    type: SECRET
  # Updated ADK Agent Configuration with new UUIDs
  - key: DIGITALOCEAN_ADK_RESEARCH_WORKSPACE_UUID
    scope: RUN_TIME
    value: "f99d6802-f8e1-49ff-ae6d-a8db1fae08a9"
  - key: DIGITALOCEAN_ADK_RESEARCH_DEPLOYMENT_UUID
    scope: RUN_TIME
    value: "8402d650-6e60-45eb-99f1-6ffd0a328e74"
  - key: DIGITALOCEAN_ADK_RISK_WORKSPACE_UUID
    scope: RUN_TIME
    value: "44227105-4e0f-479d-9717-3d5694b87778"
  - key: DIGITALOCEAN_ADK_RISK_DEPLOYMENT_UUID
    scope: RUN_TIME
    value: "474645be-658a-44de-99a0-a79b1755d6ac"
  - key: DIGITALOCEAN_ADK_FACTCHECK_WORKSPACE_UUID
    scope: RUN_TIME
    value: "20acedf1-e2e8-4910-b710-ca6b7fa9e3a2"
  - key: DIGITALOCEAN_ADK_FACTCHECK_DEPLOYMENT_UUID
    scope: RUN_TIME
    value: "71d5d476-fad2-4067-9eee-fc7c4803456e"
  # ADK Agent Deployment URLs with correct UUIDs
  - key: DIGITALOCEAN_GENAI_RESEARCH_AGENT_URL
    scope: RUN_TIME
    value: "https://agents.do-ai.run/f99d6802-f8e1-49ff-ae6d-a8db1fae08a9/research_agent_deploy/run"
  - key: DIGITALOCEAN_GENAI_RISK_AGENT_URL
    scope: RUN_TIME
    value: "https://agents.do-ai.run/44227105-4e0f-479d-9717-3d5694b87778/risk_analysis_agent_deploy/run"
  - key: DIGITALOCEAN_GENAI_FACTCHECK_AGENT_URL
    scope: RUN_TIME
    value: "https://agents.do-ai.run/20acedf1-e2e8-4910-b710-ca6b7fa9e3a2/fact_checker_agent_deploy/run"
  # GenAI Agent IDs (for health endpoint display)
  - key: DIGITALOCEAN_GENAI_RESEARCH_AGENT_ID
    scope: RUN_TIME
    value: "f99d6802-f8e1-49ff-ae6d-a8db1fae08a9"
  - key: DIGITALOCEAN_GENAI_RISK_AGENT_ID
    scope: RUN_TIME
    value: "44227105-4e0f-479d-9717-3d5694b87778"
  - key: DIGITALOCEAN_GENAI_FACTCHECK_AGENT_ID
    scope: RUN_TIME
    value: "20acedf1-e2e8-4910-b710-ca6b7fa9e3a2"
  # GenAI Configuration
  - key: DIGITALOCEAN_GENAI_PROJECT_ID
    scope: RUN_TIME
    value: "eaef27d1-07e4-4973-9f14-8cd36724af54"
  - key: DIGITALOCEAN_GENAI_MODEL_ID
    scope: RUN_TIME
