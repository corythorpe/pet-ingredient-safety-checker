    scope: RUN_TIME
    value: "https://inference.do-ai.run/v1"
  - key: DIGITALOCEAN_GENAI_STREAM_URL
    scope: RUN_TIME
    value: "https://stream.do-ai.run"
  # Cache Configuration
  - key: CACHE_DURATION_DAYS
    scope: RUN_TIME
    value: "15"
  # Security
  - key: SECRET_KEY
    scope: RUN_TIME
    value: "production_secret_key_change_this"
  # Optional: Set to 'false' to allow fallback mode
  - key: REQUIRE_GENAI
    scope: RUN_TIME
    value: "false"
