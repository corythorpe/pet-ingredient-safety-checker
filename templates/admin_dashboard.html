<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Pet Ingredient Safety Checker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .admin-dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .dashboard-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .dashboard-header h1 {
            margin: 0 0 10px 0;
            font-size: 2.5em;
        }
        
        .dashboard-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .navigation {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }
        
        .nav-btn {
            padding: 12px 24px;
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            text-decoration: none;
            color: #495057;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .nav-btn:hover {
            background: #e9ecef;
            border-color: #adb5bd;
        }
        
        .nav-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        
        .system-status {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #28a745;
        }
        
        .status-card.warning {
            border-left-color: #ffc107;
        }
        
        .status-card.error {
            border-left-color: #dc3545;
        }
        
        .status-card h3 {
            margin: 0 0 15px 0;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #28a745;
        }
        
        .status-indicator.warning {
            background: #ffc107;
        }
        
        .status-indicator.error {
            background: #dc3545;
        }
        
        .agent-trace {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        .trace-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            align-items: center;
        }
        
        .trace-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .trace-btn {
            padding: 12px 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.3s ease;
        }
        
        .trace-btn:hover {
            background: #0056b3;
        }
        
        .trace-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        .trace-timeline {
            position: relative;
            padding-left: 30px;
        }
        
        .trace-timeline::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #dee2e6;
        }
        
        .trace-step {
            position: relative;
            margin-bottom: 30px;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #007bff;
        }
        
        .trace-step::before {
            content: '';
            position: absolute;
            left: -23px;
            top: 25px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #007bff;
            border: 3px solid white;
        }
        
        .trace-step.research::before {
            background: #17a2b8;
        }
        
        .trace-step.risk::before {
            background: #ffc107;
        }
        
        .trace-step.factcheck::before {
            background: #28a745;
        }
        
        .trace-step.format::before {
            background: #6f42c1;
        }
        
        .step-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .step-title {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }
        
        .step-timing {
            font-size: 0.9em;
            color: #6c757d;
            display: flex;
            gap: 15px;
        }
        
        .step-content {
            background: white;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .step-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .metric {
            text-align: center;
            padding: 10px;
            background: #e9ecef;
            border-radius: 6px;
        }
        
        .metric-value {
            font-size: 1.5em;
            font-weight: 600;
            color: #007bff;
        }
        
        .metric-label {
            font-size: 0.9em;
            color: #6c757d;
            margin-top: 5px;
        }
        
        .agent-communication {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 6px;
            padding: 12px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 0.9em;
        }
        
        .loading-trace {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            padding: 15px;
            margin: 15px 0;
        }
        
        .json-viewer {
            background: #2d3748;
            color: #e2e8f0;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .json-key {
            color: #63b3ed;
        }
        
        .json-string {
            color: #68d391;
        }
        
        .json-number {
            color: #fbb6ce;
        }
        
        .results-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        .results-section h2 {
            margin: 0 0 20px 0;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .risk-category {
            border-radius: 8px;
            padding: 20px;
            border-left: 5px solid;
        }
        
        .risk-category.high {
            background: #f8d7da;
            border-left-color: #dc3545;
        }
        
        .risk-category.medium {
            background: #fff3cd;
            border-left-color: #ffc107;
        }
        
        .risk-category.low {
            background: #d1ecf1;
            border-left-color: #17a2b8;
        }
        
        .risk-category.no {
            background: #d4edda;
            border-left-color: #28a745;
        }
        
        .risk-category h3 {
            margin: 0 0 15px 0;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .risk-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .risk-badge.high {
            background: #dc3545;
            color: white;
        }
        
        .risk-badge.medium {
            background: #ffc107;
            color: #212529;
        }
        
        .risk-badge.low {
            background: #17a2b8;
            color: white;
        }
        
        .risk-badge.no {
            background: #28a745;
            color: white;
        }
        
        .ingredient-item {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        .ingredient-name {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 8px;
            text-transform: capitalize;
        }
        
        .ingredient-justification {
            font-size: 0.9em;
            line-height: 1.4;
            margin-bottom: 8px;
            color: #555;
        }
        
        .ingredient-sources {
            font-size: 0.8em;
            color: #666;
        }
        
        .ingredient-sources a {
            color: #007bff;
            text-decoration: none;
        }
        
        .ingredient-sources a:hover {
            text-decoration: underline;
        }
        
        .ai-powered-badge {
            display: inline-block;
            background: #6f42c1;
            color: white;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.7em;
            font-weight: 500;
            margin-left: 8px;
        }
        
        .processing-summary {
            background: #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            text-align: center;
        }
        
        .summary-stat {
            background: white;
            border-radius: 6px;
            padding: 10px;
        }
        
        .summary-stat .value {
            font-size: 1.5em;
            font-weight: 600;
            color: #007bff;
        }
        
        .summary-stat .label {
            font-size: 0.9em;
            color: #6c757d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="admin-dashboard">
        <div class="dashboard-header">
            <h1>🔧 Admin Dashboard</h1>
            <p>DigitalOcean AI Platform - Multi-Agent System Monitoring</p>
        </div>
        
        <div class="navigation">
            <a href="/" class="nav-btn">🏠 Main App</a>
            <a href="/admin" class="nav-btn active">🔧 Admin Dashboard</a>
            <a href="/how-it-works" class="nav-btn">📚 How It Works</a>
        </div>
        
        <div class="system-status" id="systemStatus">
            <!-- System status cards will be populated here -->
        </div>
        
        <div class="agent-trace">
            <h2>🤖 Agent Interaction Tracer</h2>
            <p>Monitor real-time agent communications, token usage, and processing flow</p>
            
            <div class="trace-controls">
                <input type="text" id="traceIngredients" class="trace-input" 
                       placeholder="Enter ingredients to trace (e.g., chocolate, grapes, chicken)">
                <select id="tracePetType" class="trace-input" style="flex: 0 0 150px;">
                    <option value="cat">🐱 Cat</option>
                    <option value="dog">🐕 Dog</option>
                </select>
                <button id="startTrace" class="trace-btn">Start Trace</button>
            </div>
            
            <div id="traceResults">
                <div class="loading-trace" style="display: none;">
                    <div class="loading-spinner"></div>
                    <p>Tracing agent interactions...</p>
                </div>
                
                <div id="traceTimeline" class="trace-timeline">
                    <!-- Trace steps will be populated here -->
                </div>
            </div>
        </div>
        
        <div class="results-section" id="resultsSection" style="display: none;">
            <h2>📊 Analysis Results</h2>
            <div class="results-grid" id="resultsGrid">
                <!-- Results will be populated here -->
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='admin_dashboard.js') }}"></script>
</body>
</html>
