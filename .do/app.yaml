# DigitalOcean App Platform Configuration
# Pet Ingredient Safety Checker - Multi-Agent Application

name: pet-ingredient-safety-checker
region: nyc

services:
- name: web
  source_dir: /
  github:
    repo: cthorpe/pet-ingredient-safety-checker
    branch: main
  run_command: gunicorn --bind 0.0.0.0:$PORT --workers 4 app:app
  environment_slug: python
  instance_count: 2
  instance_size_slug: basic-xxs
  http_port: 5000
  
  envs:
  - key: FLASK_ENV
    value: production
  - key: OPENAI_API_KEY
    value: ${OPENAI_API_KEY}
    type: SECRET
  - key: DATABASE_URL
    value: ${pet-safety-db.DATABASE_URL}
    type: SECRET
  - key: PORT
    value: "5000"

  health_check:
    http_path: /api/health
    initial_delay_seconds: 30
    period_seconds: 10
    timeout_seconds: 5
    success_threshold: 1
    failure_threshold: 3

databases:
- name: pet-safety-db
  engine: PG
  version: "15"
  size: basic-xs
  num_nodes: 1

domains:
- name: pet-safety-checker.your-domain.com
  type: PRIMARY

alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED

features:
- buildpack-stack=ubuntu-22

jobs:
- name: db-migrate
  source_dir: /
  github:
    repo: cthorpe/pet-ingredient-safety-checker
    branch: main
  run_command: python -c "print('Database setup complete')"
  environment_slug: python
  instance_count: 1
  instance_size_slug: basic-xxs
  kind: PRE_DEPLOY
  
  envs:
  - key: DATABASE_URL
    value: ${pet-safety-db.DATABASE_URL}
    type: SECRET
