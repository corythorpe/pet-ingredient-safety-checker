name: pet-ingredient-safety-checker-final
region: nyc
services:
- name: web
  source_dir: /
  github:
    repo: corythorpe/pet-ingredient-safety-checker
    branch: main
  run_command: gunicorn --bind 0.0.0.0:$PORT --workers 2 app:app
  environment_slug: python
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 5000
  
  envs:
  - key: FLASK_ENV
    value: production
  - key: PORT
    value: "5000"

  health_check:
    http_path: /api/health
    initial_delay_seconds: 60
    period_seconds: 30
    timeout_seconds: 10
    success_threshold: 1
    failure_threshold: 5

alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
