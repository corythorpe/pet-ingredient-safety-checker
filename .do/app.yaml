name: pet-ingredient-safety-checker
services:
- name: web
  source_dir: /
  github:
    repo: corythorpe/pet-ingredient-safety-checker
    branch: main
    deploy_on_push: true
  run_command: gunicorn --bind 0.0.0.0:$PORT app:app
  environment_slug: python
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 8080
  routes:
  - path: /
  envs:
  - key: FLASK_ENV
    value: production
  - key: OPENAI_API_KEY
    scope: RUN_TIME
    type: SECRET
  - key: TAVILY_API_KEY
    scope: RUN_TIME
    type: SECRET
databases:
- name: pet-safety-db
  engine: PG
  version: "15"
  size: basic
  num_nodes: 1
